<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Woodworking AI — Cabinet Designer</title>
<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#1c1a17; --panel:#262320; --line:#3a352f; --wood:#caa472;
          --accent:#9c6b43; --text:#ece6dd; --muted:#a59c8e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg);
         color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  .wrap { display:grid; grid-template-columns:340px 1fr; gap:0; height:calc(100vh - 53px); }
  .controls { padding:18px; overflow-y:auto; border-right:1px solid var(--line); }
  .preview { display:flex; flex-direction:column; min-width:0; }
  .stage { flex:1; background:#141210; display:flex; align-items:center;
           justify-content:center; min-height:240px; position:relative; }
  model-viewer, .stage img { width:100%; height:100%; }
  .stage .ph { color:var(--muted); }
  .results { height:42%; border-top:1px solid var(--line); display:flex;
             flex-direction:column; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 14px;
             padding:12px; }
  legend { padding:0 6px; color:var(--muted); font-size:12px; text-transform:uppercase;
           letter-spacing:.05em; }
  label { display:block; margin:8px 0 3px; font-size:12px; color:var(--muted); }
  input, select, textarea { width:100%; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  textarea { resize:vertical; min-height:60px; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .check input { width:auto; }
  button { width:100%; margin-top:10px; padding:10px; border:0; border-radius:7px;
    background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.secondary { background:#3a352f; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .or { text-align:center; color:var(--muted); margin:14px 0; font-size:12px; }
  .status { padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px;
            display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .pill { padding:2px 9px; border-radius:99px; font-size:12px; }
  .ok { background:#244a2c; color:#b6e7c0; } .bad { background:#4a2424; color:#e7b6b6; }
  .warn { background:#4a4124; color:#e7dab6; }
  .tabs { display:flex; gap:2px; padding:8px 12px 0; }
  .tabs button { width:auto; margin:0; padding:6px 12px; background:transparent;
    color:var(--muted); border-bottom:2px solid transparent; border-radius:0; font-weight:500; }
  .tabs button.active { color:var(--text); border-color:var(--accent); }
  .tabpane { flex:1; overflow:auto; padding:6px 16px 16px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel); }
  .cost-grid { display:grid; grid-template-columns:auto auto; gap:4px 24px; max-width:340px; }
  .cost-grid .total { font-weight:700; border-top:1px solid var(--line); padding-top:6px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🪵 Woodworking AI</h1>
  <span>AI cabinet &amp; furniture designer — parametric language → buildable output</span>
</header>
<div class="wrap">
  <div class="controls">
    <fieldset>
      <legend>Describe it</legend>
      <textarea id="prompt" placeholder="e.g. 900mm sink base, two shaker doors, soft-close, one shelf"></textarea>
      <button id="designBtn" class="secondary">✨ Design with AI</button>
      <div id="llmNote" class="muted" style="font-size:11px;margin-top:6px"></div>
    </fieldset>
    <div class="or">— or build from parameters —</div>
    <fieldset>
      <legend>Cabinet</legend>
      <label>Name</label><input id="name" value="My Cabinet" />
      <div class="row">
        <div><label>Type</label>
          <select id="cabinet_type">
            <option value="base">Base</option>
            <option value="wall">Wall</option>
            <option value="tall">Tall / pantry</option>
            <option value="corner_blind">Corner — blind</option>
            <option value="corner_diagonal">Corner — diagonal</option>
          </select></div>
        <div><label>Construction</label>
          <select id="construction">
            <option value="frameless">Frameless</option>
            <option value="face_frame">Face frame</option>
          </select></div>
      </div>
      <div class="row">
        <div><label>Width</label><input id="width" type="number" value="600" /></div>
        <div><label>Height</label><input id="height" type="number" value="720" /></div>
        <div><label>Depth</label><input id="depth" type="number" value="560" /></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>Fronts</legend>
      <div class="row">
        <div><label>Doors</label>
          <select id="doors"><option>0</option><option>1</option><option selected>2</option></select></div>
        <div><label>Drawers</label><input id="drawers" type="number" value="0" min="0" /></div>
        <div><label>Shelves</label><input id="shelves" type="number" value="1" min="0" /></div>
      </div>
      <div class="row">
        <div><label>Reveal (mm)</label><input id="reveal" type="number" value="3" /></div>
        <div><label>Toe kick (mm, 0=none)</label><input id="toe" type="number" value="100" /></div>
      </div>
      <div class="check"><input id="mullion" type="checkbox" /><label style="margin:0">Center mullion</label></div>
      <div id="blindWrap" style="display:none"><label>Blind width (mm)</label><input id="blind_width" type="number" value="350" /></div>
      <div id="diagWrap" style="display:none"><label>Corner cut (mm)</label><input id="corner_cut" type="number" value="450" /></div>
    </fieldset>
    <button id="buildBtn">🔨 Build design</button>
  </div>

  <div class="preview">
    <div class="stage" id="stage"><div class="ph">Build a cabinet to see it here</div></div>
    <div class="results">
      <div class="status" id="status"><span class="muted">No design yet.</span></div>
      <div class="tabs" id="tabs">
        <button data-t="cutlist" class="active">Cut list</button>
        <button data-t="hardware">Hardware</button>
        <button data-t="cost">Cost</button>
        <button data-t="drilling">Drilling</button>
      </div>
      <div class="tabpane" id="pane"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let last = null, tab = "cutlist";

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    const c = h.capabilities;
    $("designBtn").disabled = !c.llm;
    $("llmNote").textContent = c.llm ? "" :
      "Set ANTHROPIC_API_KEY on the server to enable AI design.";
    if (!c.glb) $("llmNote").textContent += " (3D model needs build123d; showing render image.)";
  } catch (e) {}
}
function toggleCorner() {
  const t = $("cabinet_type").value;
  $("blindWrap").style.display = t === "corner_blind" ? "block" : "none";
  $("diagWrap").style.display  = t === "corner_diagonal" ? "block" : "none";
}
$("cabinet_type").addEventListener("change", toggleCorner);

function specFromForm() {
  const toe = +$("toe").value;
  const nd = Math.max(0, +$("drawers").value | 0);
  return {
    cabinet_type: $("cabinet_type").value,
    construction: $("construction").value,
    name: $("name").value || "Cabinet",
    width: +$("width").value, height: +$("height").value, depth: +$("depth").value,
    doors: +$("doors").value, shelves: Math.max(0, +$("shelves").value | 0),
    drawers: Array.from({length: nd}, () => ({front_height: 140})),
    reveal: +$("reveal").value,
    center_mullion: $("mullion").checked,
    blind_width: +($("blind_width").value || 0),
    corner_cut: +($("corner_cut").value || 0),
    toe_kick: toe > 0 ? {height: toe, setback: 50} : null,
  };
}

function setBusy(b) {
  $("buildBtn").disabled = b; $("designBtn").disabled = b;
  if (b) $("stage").innerHTML = '<div class="ph">Building…</div>';
}
async function post(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
  return r.json();
}
$("buildBtn").onclick = async () => {
  setBusy(true);
  try { render(await post("/api/build", {spec: specFromForm()})); }
  catch (e) { showError(e.message); } finally { setBusy(false); health(); }
};
$("designBtn").onclick = async () => {
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  setBusy(true);
  try {
    const d = await post("/api/design", {prompt});
    syncForm(d.spec); render(d);
  } catch (e) { showError(e.message); } finally { setBusy(false); health(); }
};

function syncForm(s) {
  for (const k of ["name","cabinet_type","construction","width","height","depth",
                   "doors","shelves","reveal","blind_width","corner_cut"])
    if (s[k] !== undefined && $(k)) $(k).value = s[k];
  $("drawers").value = (s.drawers || []).length;
  $("mullion").checked = !!s.center_mullion;
  $("toe").value = s.toe_kick ? s.toe_kick.height : 0;
  toggleCorner();
}
function showError(msg) {
  $("stage").innerHTML = '<div class="ph">⚠ ' + msg + '</div>';
  $("status").innerHTML = '<span class="pill bad">error</span><span>'+msg+'</span>';
}

function render(d) {
  last = d;
  if (d.errors && d.errors.length) {
    showError(d.errors.map(e => e.field+": "+e.message).join("; ")); return;
  }
  // 3D / image stage
  if (d.glb) {
    $("stage").innerHTML =
      `<model-viewer camera-controls auto-rotate shadow-intensity="1"
        exposure="1.1" src="${d.glb}"></model-viewer>`;
  } else if (d.render_png) {
    $("stage").innerHTML = `<img src="${d.render_png}" style="object-fit:contain" />`;
  } else $("stage").innerHTML = '<div class="ph">No preview available</div>';

  // status
  const e = d.estimate, cr = d.critique;
  const bits = [];
  bits.push(`<span class="pill ${d.valid?'ok':'bad'}">${d.valid?'valid':'invalid'}</span>`);
  if (cr) bits.push(`<span class="pill ${cr.ok?'ok':'warn'}">geometry ${cr.ok?'verified':'check'}</span>`);
  if (e) bits.push(`<strong>${e.currency}${e.total.toFixed(2)}</strong> · ${e.total_sheets} sheets · ${e.labour_hours}h`);
  if (d.warnings && d.warnings.length)
    bits.push(`<span class="pill warn">${d.warnings.length} warning(s)</span>`);
  if (d.attempts) bits.push(`<span class="muted">AI: ${d.attempts} attempt(s)</span>`);
  $("status").innerHTML = bits.join("");
  paint();
}

function paint() {
  if (!last) return;
  const d = last; let h = "";
  if (tab === "cutlist") {
    h = table(["Part","Qty","L","W","Thk","Material","Notes"],
      d.cutlist.map(p => [p.name,p.qty,p.length,p.width,p.thickness,p.material,p.notes]));
    h += `<p class="muted">${d.cutlist_summary||""}</p>`;
  } else if (tab === "hardware") {
    h = table(["Item","Qty","Notes"], d.hardware.map(x=>[x.name,x.qty,x.notes]));
  } else if (tab === "cost") {
    const e = d.estimate;
    h = `<div class="cost-grid">
      <div>Material (${e.total_sheets} sheets)</div><div>${e.currency}${e.material.toFixed(2)}</div>
      <div>Hardware</div><div>${e.currency}${e.hardware.toFixed(2)}</div>
      <div>Edge banding</div><div>${e.currency}${e.edge_banding.toFixed(2)}</div>
      <div>Labour (${e.labour_hours}h)</div><div>${e.currency}${e.labour.toFixed(2)}</div>
      <div class="total">Total</div><div class="total">${e.currency}${e.total.toFixed(2)}</div></div>
      <h4>Sheets</h4>` +
      table(["Material","Thk","Parts","Sheets","Used"],
        e.groups.map(g=>[g.material,g.thickness,g.parts,g.sheets,Math.round(g.utilization*100)+"%"]));
  } else if (tab === "drilling") {
    h = `<p class="muted">${d.drilling.total_holes} holes total</p>` +
      table(["Part","Operation","Holes","Note"],
        d.drilling.ops.map(o=>[o.part,o.operation,o.holes,o.note]));
  }
  $("pane").innerHTML = h;
}
function table(cols, rows) {
  return "<table><thead><tr>" + cols.map(c=>`<th>${c}</th>`).join("") +
    "</tr></thead><tbody>" +
    rows.map(r=>"<tr>"+r.map(c=>`<td>${c??""}</td>`).join("")+"</tr>").join("") +
    "</tbody></table>";
}
$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  $("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
  paint();
});

health();
</script>
</body>
</html>
