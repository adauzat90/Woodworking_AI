name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + render + web + dev)
        # build123d (OpenCascade) is intentionally omitted — it is heavy, and the
        # tests that need it skip gracefully via pytest.importorskip. The
        # pure-math, render, and web suites give the bulk of the coverage.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[render,web,dev]"

      - name: Run tests
        run: pytest -q
